<html lang="ja">

<head>

</head>
<body>
    <form action="/submit" method="POST"></form>
    <form>
        <input type="email" placeholder="メールアドレス:">

    <form>
        <input type="radio" name="option" value="1"> 男性

        <input type="checkbox" name="option1" value="1"> 技術
        <input type="checkbox" name="option2" value="2"> 芸術
        <input type="checkbox" name="option2" value="3"> 科学
    </form>
    <select name="country">
        <option value="1">日本</option>
        <option value="2">アメリカ</option>
        <option value="3">イギリス</option>
    </select>
    <textarea name="comment" rows="4" cols="50"></textarea>
    <button type="submit">送信</button>
    </form>
